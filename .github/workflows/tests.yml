name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" build
      - run: python -m unittest discover -s tests -q
      - run: python -m build
      - name: Install built wheel and smoke-test outside checkout
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.check_call([sys.executable, '-m', 'pip', 'uninstall', '-y', 'spatial-engine-research'])
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)])
          with tempfile.TemporaryDirectory() as directory:
              def run(*args):
                  subprocess.check_call([sys.executable, '-m', 'engine', *args], cwd=directory)
              run('--version')
              run('examples', 'basic_3d', '--output', 'demo.json')
              run('run', '--config', 'demo.json', '--output', 'run')
              run('genealogy', '--manifest', 'run', '--csv', 'genealogy.csv')
